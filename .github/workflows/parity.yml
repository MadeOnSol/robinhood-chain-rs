name: parity
# Fails if this SDK drifts from the 40 documented Robinhood Chain (chain 4663)
# API paths — either references a path that isn't one of them, or stops covering
# one. Node-based, needs no cargo. This standalone crate is not scanned by the
# monorepo's SDK route-parity guard, so it ships its own.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  route-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check SDK paths against the 40 RHC paths
        run: node scripts/route-parity-check.mjs
      # Pinned API contract (sdk-contract/, synced from the monorepo with
      # `node scripts/sync-sdk-contract.mjs <this-repo-dir>`): fails when the
      # SDK lacks an operation or critical response field its policy requires.
      - name: Check SDK against the pinned MadeOnSol API contract
        run: node sdk-contract/check-sdk-contract.mjs
